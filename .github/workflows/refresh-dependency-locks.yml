name: Refresh locked dependencies (maintainer)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, pdo, pdo_pgsql, ctype, filter, curl, mbstring
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: docker/setup-buildx-action@v3
      - name: Resolve real dependencies, generate integrity locks and run installs
        run: python3 scripts/dependency_locks.py refresh
      - name: Upload actual generated lock files for review and commit
        uses: actions/upload-artifact@v4
        with:
          name: cajeerlogs-verified-lockfiles
          if-no-files-found: error
          path: |
            composer.lock
            packages/ts-sdk/package-lock.json
            clients/java-kotlin/gradle.lockfile
            clients/java-kotlin/gradle/verification-metadata.xml
