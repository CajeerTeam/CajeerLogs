name: Runtime and PostgreSQL
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/release.py build release-out/CajeerLogs-0.7.9.zip
          (cd release-out && sha256sum -c CajeerLogs-0.7.9.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: CajeerLogs-0.7.9-candidate-uncertified
          path: release-out/
          if-no-files-found: error
  runtime:
    needs: build-candidate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: cajeer_logs
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-superuser-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cajeer_logs"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      APP_URL: http://localhost:8080
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: cajeer_logs
      DB_USERNAME: cajeer_logs
      DB_PASSWORD: ci-app-role-password-only
      DB_SCHEMA: public
      DB_SSLMODE: disable
      CAJEER_TEST_DATABASE: '1'
      CAJEER_TEST_RESTORE_DB: cajeer_restore_ci
      CAJEER_TEST_UPGRADE_RESTORE_DB: cajeer_upgrade_restore_ci
      PG_DUMP_BIN: /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_dump
      PG_RESTORE_BIN: /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_restore
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: CajeerLogs-0.7.9-candidate-uncertified
          path: release-out
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, filter, curl, pdo, pdo_pgsql, sodium, dom, mbstring, xml, xmlwriter, pcntl, posix
          coverage: none
          tools: composer:v2
      - name: Provision restricted PostgreSQL role
        env:
          PGPASSWORD: ci-postgres-superuser-only
        run: |
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          psql -h 127.0.0.1 -U postgres -d cajeer_logs -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE cajeer_logs LOGIN PASSWORD 'ci-app-role-password-only';
          ALTER DATABASE cajeer_logs OWNER TO cajeer_logs;
          CREATE DATABASE cajeer_restore_ci OWNER cajeer_logs;
          CREATE DATABASE cajeer_upgrade_restore_ci OWNER cajeer_logs;
          SQL
      - name: Install matching PostgreSQL client tools
        run: |
          if [ ! -x /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_dump ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-client-${{ matrix.postgres }}
          fi
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: |
          find core config app public bin installer tests packages/php-sdk -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l bin/cajeer
      - run: composer analyse
      - run: composer test
      - run: composer test:runtime
      - run: php bin/cajeer install:check
      - run: php tests/postgres_runtime.php
      - run: php tests/transaction.php
      - run: php tests/migration_engine.php
      - run: php tests/installer.php
      - run: php tests/secure_installer.php
      - run: php tests/projects.php
      - run: php tests/sources.php
      - run: node --test tests/analytics_dashboard.mjs
      - run: node --test tests/advanced_search.mjs
      - run: php tests/advanced_search.php
      - run: python3 tests/s3_storage.py
      - run: CAJEER_TEST_DATABASE=1 python3 tests/s3_storage.py
      - run: CAJEER_TEST_DATABASE=1 php tests/advanced_search_database.php
      - run: php tests/error_analytics.php
      - run: CAJEER_TEST_DATABASE=1 php tests/error_analytics_database.php
      - run: php tests/source_monitoring.php
      - run: CAJEER_TEST_DATABASE=1 php tests/source_monitoring_database.php
      - run: php tests/tokens.php
      - run: php tests/integrity.php
      - run: python3 tests/benchmark.py
      - run: python3 tests/load_test.py
      - run: composer test:database-config
      - run: composer test:identity
      - run: composer test:ingest
      - run: composer test:ingest-authorization
      - run: php tests/hmac.php
      - run: php tests/redaction.php
      - run: php tests/delivery.php
      - run: php tests/ingest_runtime.php
      - run: php tests/batch_ingestion.php
      - run: php tests/event_validation.php
      - run: composer test:search
      - run: composer test:search-runtime
      - run: composer test:pagination
      - run: composer test:release-pipeline
      - run: php tests/log_repository.php
      - run: python3 tests/archive_import.py
      - run: python3 tests/nginx_import_stable.py
      - run: python3 tests/aapanel_integration_stable.py
      - run: php bin/cajeer openapi:lint
      - run: python3 tests/http_runtime.py
      - run: php tests/deployment_security.php
      - run: python3 tests/deployment_tls.py
      - run: python3 tests/python_ingest.py
      - run: php tests/webhooks.php
      - run: php tests/throughput_planner.php
      - run: php tests/worker_microbatch.php
      - run: php tests/queue.php
      - run: php tests/retry_policy.php
      - run: php tests/security_operations.php
      - run: php tests/release_runtime.php
      - run: php tests/export_jobs.php
      - run: php tests/restore_fence.php
      - run: python3 tests/certify.py
      - run: python3 tests/release.py
      - name: PostgreSQL runtime failure recovery, TLS and session pooling
        env:
          PGPASSWORD: ci-postgres-superuser-only
          CAJEER_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          bash tests/postgres_ci.sh
          CAJEER_TEST_PG_TLS_CERT=/tmp/cajeer-pg-runtime/cert.pem CAJEER_TEST_PGBOUNCER_PORT=6432 php tests/postgres_runtime_database.php
      - name: Separate migration and runtime roles
        env:
          PGPASSWORD: ci-postgres-superuser-only
          CAJEER_TEST_SPLIT_ROLE: '1'
        run: |
          psql -h 127.0.0.1 -U postgres -d cajeer_logs -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE cl_migrator_ci LOGIN PASSWORD 'ci-migration-split-password';
          CREATE ROLE cl_runtime_ci LOGIN PASSWORD 'ci-runtime-split-password';
          GRANT CREATE ON DATABASE cajeer_logs TO cl_migrator_ci;
          SQL
          php tests/postgres_split_role.php
          psql -h 127.0.0.1 -U postgres -d cajeer_logs -v ON_ERROR_STOP=1 -c 'DROP SCHEMA cl_split_role CASCADE' 
