name: Runtime and PostgreSQL
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/release.py build release-out/CajeerLogs-0.5.0.zip
          (cd release-out && sha256sum -c CajeerLogs-0.5.0.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: CajeerLogs-0.5.0-candidate-uncertified
          path: release-out/
          if-no-files-found: error
  runtime:
    needs: build-candidate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: cajeer_logs
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-superuser-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cajeer_logs"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      APP_URL: http://localhost:8080
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: cajeer_logs
      DB_USERNAME: cajeer_logs
      DB_PASSWORD: ci-app-role-password-only
      DB_SCHEMA: public
      DB_SSLMODE: disable
      CAJEER_TEST_DATABASE: '1'
      CAJEER_TEST_RESTORE_DB: cajeer_restore_ci
      CAJEER_TEST_UPGRADE_RESTORE_DB: cajeer_upgrade_restore_ci
      PG_DUMP_BIN: /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_dump
      PG_RESTORE_BIN: /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_restore
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: CajeerLogs-0.5.0-candidate-uncertified
          path: release-out
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, filter, curl, pdo, pdo_pgsql, sodium, dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Provision restricted PostgreSQL role
        env:
          PGPASSWORD: ci-postgres-superuser-only
        run: |
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          psql -h 127.0.0.1 -U postgres -d cajeer_logs -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE cajeer_logs LOGIN PASSWORD 'ci-app-role-password-only';
          ALTER DATABASE cajeer_logs OWNER TO cajeer_logs;
          CREATE DATABASE cajeer_restore_ci OWNER cajeer_logs;
          CREATE DATABASE cajeer_upgrade_restore_ci OWNER cajeer_logs;
          SQL
      - name: Install matching PostgreSQL client tools
        run: |
          if [ ! -x /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_dump ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-client-${{ matrix.postgres }}
          fi
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: |
          find core config app public bin installer tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l bin/cajeer
      - run: composer analyse
      - run: composer test
      - run: composer test:runtime
      - run: php bin/cajeer install:check
      - run: php tests/postgres_runtime.php
      - run: php tests/transaction.php
      - run: php tests/migration_engine.php
      - run: php tests/installer.php
      - run: php tests/secure_installer.php
      - run: php tests/projects.php
      - run: php tests/sources.php
      - run: php tests/tokens.php
      - run: php tests/integrity.php
      - run: python3 tests/benchmark.py
      - run: composer test:database-config
      - run: composer test:identity
      - run: composer test:ingest
      - run: composer test:ingest-authorization
      - run: php tests/hmac.php
      - run: php tests/redaction.php
      - run: php tests/delivery.php
      - run: php tests/ingest_runtime.php
      - run: php tests/batch_ingestion.php
      - run: php tests/event_validation.php
      - run: composer test:search
      - run: composer test:search-runtime
      - run: composer test:pagination
      - run: composer test:release-pipeline
      - run: php tests/log_repository.php
      - run: python3 tests/archive_import.py
      - run: php bin/cajeer openapi:lint
      - run: python3 tests/http_runtime.py
      - run: php tests/deployment_security.php
      - run: python3 tests/deployment_tls.py
      - run: python3 tests/python_ingest.py
      - run: php tests/webhooks.php
      - run: php tests/queue.php
      - run: php tests/security_operations.php
      - run: php tests/release_runtime.php
      - run: php tests/restore_fence.php
      - run: python3 tests/certify.py
      - run: python3 tests/release.py
      - name: PostgreSQL runtime failure recovery, TLS and session pooling
        env:
          PGPASSWORD: ci-postgres-superuser-only
          CAJEER_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          bash tests/postgres_ci.sh
          CAJEER_TEST_PG_TLS_CERT=/tmp/cajeer-pg-runtime/cert.pem CAJEER_TEST_PGBOUNCER_PORT=6432 php tests/postgres_runtime_database.php
      - name: Separate migration and runtime roles
        env:
          PGPASSWORD: ci-postgres-superuser-only
          CAJEER_TEST_SPLIT_ROLE: '1'
        run: |
          psql -h 127.0.0.1 -U postgres -d cajeer_logs -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE cl_migrator_ci LOGIN PASSWORD 'ci-migration-split-password';
          CREATE ROLE cl_runtime_ci LOGIN PASSWORD 'ci-runtime-split-password';
          GRANT CREATE ON DATABASE cajeer_logs TO cl_migrator_ci;
          SQL
          php tests/postgres_split_role.php
          psql -h 127.0.0.1 -U postgres -d cajeer_logs -v ON_ERROR_STOP=1 -c 'DROP SCHEMA cl_split_role CASCADE' 
      - name: Database core certification of the exact release ZIP (including all supported upgrades and the integrated pipeline)
        run: |
          mkdir -p /tmp/cajeer-0.1.0 /tmp/cajeer-0.2.0 /tmp/cajeer-0.2.9 /tmp/cajeer-0.3.0 /tmp/cajeer-0.3.2 /tmp/cajeer-0.3.3 /tmp/cajeer-0.3.4 /tmp/cajeer-0.3.5 /tmp/cajeer-0.3.6 /tmp/cajeer-0.3.7 /tmp/cajeer-0.3.8 /tmp/cajeer-0.3.9 /tmp/cajeer-0.4.0 /tmp/cajeer-0.4.1 /tmp/cajeer-0.4.2 /tmp/cajeer-0.4.3
          git archive 9b2054b80044492311095538867ef774730dd8fb | tar -x -C /tmp/cajeer-0.1.0
          git archive a8b9c1529fdcefa280fa70ff7a2539e55f5426ec | tar -x -C /tmp/cajeer-0.2.0
          git archive 8df59aa458f6a93a4e5de3f67ca07c5898a6fa8f | tar -x -C /tmp/cajeer-0.2.9
          git archive c80f48e3526760bc95f5a89cf66a1ccf33ca3a7a | tar -x -C /tmp/cajeer-0.3.0
          git archive 23456934c5bd75a717ac5b840d235db835f99434 | tar -x -C /tmp/cajeer-0.3.2
          git archive d4ebbe0ad4417940d548715901d68c38670c140d | tar -x -C /tmp/cajeer-0.3.3
          git archive a3b3089db2b477405d49bdc94515ed284d3e5450 | tar -x -C /tmp/cajeer-0.3.4
          # Discover the actual preceding release from repository history, not a fabricated commit.
          previous035=$(python3 - <<'PYCODE'
          import json, subprocess
          for commit in subprocess.check_output(['git','log','--format=%H','--','release.json'],text=True).splitlines():
              data=subprocess.run(['git','show',commit+':release.json'],capture_output=True,text=True)
              if data.returncode==0 and json.loads(data.stdout).get('version')=='0.3.5':
                  print(commit); break
          else: raise SystemExit('Missing actual 0.3.5 source history')
          PYCODE
          )
          git archive "$previous035" | tar -x -C /tmp/cajeer-0.3.5
          previous036=$(python3 - <<'PYCODE'
          import json, subprocess
          for commit in subprocess.check_output(['git','log','--format=%H','--','release.json'],text=True).splitlines():
              data=subprocess.run(['git','show',commit+':release.json'],capture_output=True,text=True)
              if data.returncode==0 and json.loads(data.stdout).get('version')=='0.3.6':
                  print(commit); break
          else: raise SystemExit('Missing actual 0.3.6 source history')
          PYCODE
          )
          git archive "$previous036" | tar -x -C /tmp/cajeer-0.3.6
          previous037=$(python3 - <<'PYCODE'
          import json, subprocess
          for commit in subprocess.check_output(['git','log','--format=%H','--','release.json'],text=True).splitlines():
              data=subprocess.run(['git','show',commit+':release.json'],capture_output=True,text=True)
              if data.returncode==0 and json.loads(data.stdout).get('version')=='0.3.7':
                  print(commit); break
          else: raise SystemExit('Missing actual 0.3.7 source history')
          PYCODE
          )
          git archive "$previous037" | tar -x -C /tmp/cajeer-0.3.7
          previous038=$(python3 - <<'PYCODE'
          import json, subprocess
          for commit in subprocess.check_output(['git','log','--format=%H','--','release.json'],text=True).splitlines():
              data=subprocess.run(['git','show',commit+':release.json'],capture_output=True,text=True)
              if data.returncode==0 and json.loads(data.stdout).get('version')=='0.3.8':
                  print(commit); break
          else: raise SystemExit('Missing actual 0.3.8 source history')
          PYCODE
          )
          git archive "$previous038" | tar -x -C /tmp/cajeer-0.3.8
          previous039=$(python3 - <<'PYCODE'
          import json, subprocess
          for commit in subprocess.check_output(['git','log','--format=%H','--','release.json'],text=True).splitlines():
              data=subprocess.run(['git','show',commit+':release.json'],capture_output=True,text=True)
              if data.returncode==0 and json.loads(data.stdout).get('version')=='0.3.9':
                  print(commit); break
          else: raise SystemExit('Missing actual 0.3.9 source history')
          PYCODE
          )
          git archive "$previous039" | tar -x -C /tmp/cajeer-0.3.9
          previous040=$(python3 - <<'PY040'
          import json, subprocess
          for commit in subprocess.check_output(['git','rev-list','HEAD'],text=True).splitlines():
              data=subprocess.run(['git','show',commit+':release.json'],capture_output=True,text=True)
              if data.returncode==0 and json.loads(data.stdout).get('version')=='0.4.0':
                  print(commit); break
          else: raise SystemExit('Missing actual 0.4.0 source history')
          PY040
          )
          git archive "$previous040" | tar -x -C /tmp/cajeer-0.4.0
          previous041=$(python3 - <<'PY041'
          import json, subprocess
          for commit in subprocess.check_output(['git','rev-list','HEAD'],text=True).splitlines():
              data=subprocess.run(['git','show',commit+':release.json'],capture_output=True,text=True)
              if data.returncode==0 and json.loads(data.stdout).get('version')=='0.4.1':
                  print(commit); break
          else: raise SystemExit('Missing actual 0.4.1 source history')
          PY041
          )
          git archive "$previous041" | tar -x -C /tmp/cajeer-0.4.1
          previous042=$(python3 - <<'PY042'
          import json, subprocess
          for commit in subprocess.check_output(['git','rev-list','HEAD'],text=True).splitlines():
              data=subprocess.run(['git','show',commit+':release.json'],capture_output=True,text=True)
              if data.returncode==0 and json.loads(data.stdout).get('version')=='0.4.2':
                  print(commit); break
          else: raise SystemExit('Missing actual 0.4.2 source history')
          PY042
          )
          git archive "$previous042" | tar -x -C /tmp/cajeer-0.4.2
          mkdir -p /tmp/cajeer-0.4.3
          previous043=$(python3 - <<'PY043'
          import json, subprocess
          for commit in subprocess.check_output(['git','rev-list','HEAD'],text=True).splitlines():
              data=subprocess.run(['git','show',commit+':release.json'],capture_output=True,text=True)
              if data.returncode==0 and json.loads(data.stdout).get('version')=='0.4.3':
                  print(commit); break
          else: raise SystemExit('Missing actual 0.4.3 source history')
          PY043
          )
          git archive "$previous043" | tar -x -C /tmp/cajeer-0.4.3
          mkdir -p /tmp/cajeer-0.4.4
          previous044=$(python3 - <<'PY044'
          import json, subprocess
          for commit in subprocess.check_output(['git','rev-list','HEAD'],text=True).splitlines():
              data=subprocess.run(['git','show',commit+':release.json'],capture_output=True,text=True)
              if data.returncode==0 and json.loads(data.stdout).get('version')=='0.4.4':
                  print(commit); break
          else: raise SystemExit('Missing actual 0.4.4 source history')
          PY044
          )
          git archive "$previous044" | tar -x -C /tmp/cajeer-0.4.4
          mkdir -p /tmp/cajeer-0.4.5
          previous045=$(python3 - <<'PY045'
          import json, subprocess
          for commit in subprocess.check_output(['git','rev-list','HEAD'],text=True).splitlines():
              data=subprocess.run(['git','show',commit+':release.json'],capture_output=True,text=True)
              if data.returncode==0 and json.loads(data.stdout).get('version')=='0.4.5':
                  print(commit); break
          else: raise SystemExit('Missing actual 0.4.5 source history')
          PY045
          )
          git archive "$previous045" | tar -x -C /tmp/cajeer-0.4.5
          mkdir -p /tmp/cajeer-0.4.6
          previous046=$(python3 - <<'PY046'
          import json, subprocess
          for commit in subprocess.check_output(['git','rev-list','HEAD'],text=True).splitlines():
              data=subprocess.run(['git','show',commit+':release.json'],capture_output=True,text=True)
              if data.returncode==0 and json.loads(data.stdout).get('version')=='0.4.6':
                  print(commit); break
          else: raise SystemExit('Missing actual 0.4.6 source history')
          PY046
          )
          git archive "$previous046" | tar -x -C /tmp/cajeer-0.4.6
          mkdir -p /tmp/cajeer-0.4.7
          git archive 72b86c59867103dd37e8bfb7f79e2b5637fbdba7 | tar -x -C /tmp/cajeer-0.4.7
          mkdir -p /tmp/cajeer-0.4.8
          git archive faf32430c67a209aaaf87976103e57e6b8e32d51 | tar -x -C /tmp/cajeer-0.4.8
          mkdir -p /tmp/cajeer-0.4.9
          previous049=$(python3 - <<'PY049'
          import json, subprocess
          for commit in subprocess.check_output(['git','rev-list','HEAD'],text=True).splitlines():
              data=subprocess.run(['git','show',commit+':release.json'],capture_output=True,text=True)
              if data.returncode==0 and json.loads(data.stdout).get('version')=='0.4.9':
                  print(commit); break
          else: raise SystemExit('Missing actual 0.4.9 source history')
          PY049
          )
          git archive "$previous049" | tar -x -C /tmp/cajeer-0.4.9
          mkdir -p /tmp/cajeer-0.4.10
          previous0410=$(python3 - <<'PY0410'
          import json, subprocess
          for commit in subprocess.check_output(['git','rev-list','HEAD'],text=True).splitlines():
              data=subprocess.run(['git','show',commit+':release.json'],capture_output=True,text=True)
              if data.returncode==0 and json.loads(data.stdout).get('version')=='0.4.10':
                  print(commit); break
          else: raise SystemExit('Missing actual 0.4.10 source history')
          PY0410
          )
          git archive "$previous0410" | tar -x -C /tmp/cajeer-0.4.10
          python3 scripts/certify.py database release-out/CajeerLogs-0.5.0.zip --from-010 /tmp/cajeer-0.1.0 --from-020 /tmp/cajeer-0.2.0 --from-029 /tmp/cajeer-0.2.9 --from-030 /tmp/cajeer-0.3.0 --from-032 /tmp/cajeer-0.3.2 --from-033 /tmp/cajeer-0.3.3 --from-034 /tmp/cajeer-0.3.4 --from-035 /tmp/cajeer-0.3.5 --from-036 /tmp/cajeer-0.3.6 --from-037 /tmp/cajeer-0.3.7 --from-038 /tmp/cajeer-0.3.8 --from-039 /tmp/cajeer-0.3.9 --from-040 /tmp/cajeer-0.4.0 --from-041 /tmp/cajeer-0.4.1 --from-042 /tmp/cajeer-0.4.2 --from-043 /tmp/cajeer-0.4.3 --from-044 /tmp/cajeer-0.4.4 --from-045 /tmp/cajeer-0.4.5 --from-046 /tmp/cajeer-0.4.6 --from-047 /tmp/cajeer-0.4.7 --from-048 /tmp/cajeer-0.4.8 --from-049 /tmp/cajeer-0.4.9 --from-0410 /tmp/cajeer-0.4.10 --output /tmp/database-certification.json
      - uses: actions/setup-java@v4
        if: matrix.php == '8.4' && matrix.postgres == '17'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.php == '8.4' && matrix.postgres == '17'
        with:
          gradle-version: '8.10.2'
      - name: SDK HTTP and collector tests
        if: matrix.php == '8.4' && matrix.postgres == '17'
        run: |
          npm --prefix packages/ts-sdk install --no-audit --no-fund
          python3 tests/sdk_wire.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Admin asset verification
        run: npm --prefix admin run build
      - name: Install browser test runner
        if: matrix.php == '8.4' && matrix.postgres == '17'
        run: |
          python3 -m venv /tmp/cajeer-browser-venv
          /tmp/cajeer-browser-venv/bin/pip install 'playwright==1.52.0'
          /tmp/cajeer-browser-venv/bin/python -m playwright install --with-deps chromium firefox webkit
      - name: Admin panel E2E on the exact release archive (Chromium, Firefox, WebKit)
        if: matrix.php == '8.4' && matrix.postgres == '17'
        run: /tmp/cajeer-browser-venv/bin/python scripts/certify.py admin release-out/CajeerLogs-0.5.0.zip --output /tmp/admin-certification.json
      - name: Upload admin evidence only after all mandatory browser stages pass
        if: matrix.php == '8.4' && matrix.postgres == '17'
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-evidence
          path: /tmp/admin-certification.json
          if-no-files-found: error

      - name: Upload database evidence only after all mandatory tests pass
        uses: actions/upload-artifact@v4
        with:
          name: database-evidence-php${{ matrix.php }}-pg${{ matrix.postgres }}
          path: /tmp/database-certification.json
          if-no-files-found: error

  public-release:
    needs: [build-candidate, runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CajeerLogs-0.5.0-candidate-uncertified
          path: release-out
      - uses: actions/download-artifact@v4
        with:
          pattern: database-evidence-*
          path: /tmp/database-evidence
      - uses: actions/download-artifact@v4
        with:
          name: admin-panel-evidence
          path: /tmp/admin-evidence
      - name: Verify full matrix, admin evidence and production smoke on the identical archive
        run: |
          (cd release-out && sha256sum -c CajeerLogs-0.5.0.zip.sha256)
          python3 scripts/certify.py release release-out/CajeerLogs-0.5.0.zip --reports /tmp/database-evidence --admin-report /tmp/admin-evidence/admin-certification.json --output release-out/database-certification.json
      - uses: actions/upload-artifact@v4
        with:
          name: CajeerLogs-0.5.0-certified-ci
          path: |
            release-out/CajeerLogs-0.5.0.zip
            release-out/CajeerLogs-0.5.0.zip.sha256
            release-out/database-certification.json
          if-no-files-found: error
