      - uses: actions/setup-java@v4
        if: matrix.php == '8.4' && matrix.postgres == '17'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.php == '8.4' && matrix.postgres == '17'
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-node@v4
        if: matrix.php == '8.4' && matrix.postgres == '17'
        with:
          node-version: 22
      - name: TypeScript production SDK build, tests and npm package
        if: matrix.php == '8.4' && matrix.postgres == '17'
        run: |
          npm --prefix packages/ts-sdk install --no-audit --no-fund
          npm --prefix packages/ts-sdk run check
          npm --prefix packages/ts-sdk pack --dry-run
      - name: Kotlin/JVM SDK compile, Maven publication and signed queue integration
        if: matrix.php == '8.4' && matrix.postgres == '17'
        run: |
          gradle -p clients/java-kotlin build publishToMavenLocal --no-daemon
          python3 tests/kotlin_sdk_stable.py
      - name: SDK HTTP and collector tests
        if: matrix.php == '8.4' && matrix.postgres == '17'
        run: |
          python3 tests/sdk_wire.py
          python3 tests/sdk_async_wire.py
          python3 tests/sdk_buffered_wire.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Admin asset verification
        run: npm --prefix admin run build
      - name: Install browser test runner
        if: matrix.php == '8.4' && matrix.postgres == '17'
        run: |
          python3 -m venv /tmp/cajeer-browser-venv
          /tmp/cajeer-browser-venv/bin/pip install 'playwright==1.52.0'
          /tmp/cajeer-browser-venv/bin/python -m playwright install --with-deps chromium firefox webkit
      - name: Admin panel E2E on the exact release archive (Chromium, Firefox, WebKit)
        if: matrix.php == '8.4' && matrix.postgres == '17'
        run: /tmp/cajeer-browser-venv/bin/python scripts/certify.py admin release-out/CajeerLogs-1.0.0.zip --output /tmp/admin-certification.json
      - name: Certify installed SDKs and importers from the exact verified release ZIP
        if: matrix.php == '8.4' && matrix.postgres == '17'
        run: python3 scripts/integrations.py release-out/CajeerLogs-1.0.0.zip --output /tmp/sdk-integration-certification.json
      - name: Upload SDK evidence only after real packaged tests pass
        if: matrix.php == '8.4' && matrix.postgres == '17'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-integrations-evidence
          path: /tmp/sdk-integration-certification.json
          if-no-files-found: error
      - name: Upload admin evidence only after all mandatory browser stages pass
        if: matrix.php == '8.4' && matrix.postgres == '17'
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-evidence
          path: /tmp/admin-certification.json
          if-no-files-found: error

      - name: Upload database evidence only after all mandatory tests pass
        uses: actions/upload-artifact@v4
        with:
          name: database-evidence-php${{ matrix.php }}-pg${{ matrix.postgres }}
          path: /tmp/database-certification.json
          if-no-files-found: error

  public-release:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.0.0'
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: [build-candidate, runtime, clickhouse-integration, integration-stability, security-acceptance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CajeerLogs-1.0.0-candidate-uncertified
          path: release-out
      - uses: actions/download-artifact@v4
        with:
          pattern: database-evidence-*
          path: /tmp/database-evidence
      - uses: actions/download-artifact@v4
        with:
          name: admin-panel-evidence
          path: /tmp/admin-evidence
      - uses: actions/download-artifact@v4
        with:
          name: sdk-integrations-evidence
          path: /tmp/sdk-evidence
      - uses: actions/download-artifact@v4
        with:
          name: analytics-storage-evidence
          path: /tmp/analytics-storage-evidence
      - uses: actions/download-artifact@v4
        with:
          name: integration-stability-evidence
          path: /tmp/integration-stability-evidence
      - uses: actions/download-artifact@v4
        with:
          name: security-acceptance-evidence
          path: /tmp/security-acceptance-evidence
      - name: Verify SBOM, independent builds, locked dependencies and authenticated GitHub provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/supply_chain.py verify release-out/CajeerLogs-1.0.0.zip --sbom release-out/CajeerLogs-1.0.0.sbom.cdx.json --provenance release-out/CajeerLogs-1.0.0.provenance.json --report release-out/supply-chain-report.json --strict-dependencies
          gh attestation verify release-out/CajeerLogs-1.0.0.zip --repo "$GITHUB_REPOSITORY"
      - name: Verify full matrix, admin, real production and long-duration async performance on the identical archive
        run: |
          (cd release-out && sha256sum -c CajeerLogs-1.0.0.zip.sha256)
          python3 scripts/certify.py release release-out/CajeerLogs-1.0.0.zip --reports /tmp/database-evidence --admin-report /tmp/admin-evidence/admin-certification.json --sdk-report /tmp/sdk-evidence/sdk-integration-certification.json --analytics-storage-report /tmp/analytics-storage-evidence/analytics-storage-certification.json --integration-report /tmp/integration-stability-evidence/integration-stability.json --security-report /tmp/security-acceptance-evidence/security-acceptance.json --supply-chain-report release-out/supply-chain-report.json --reproducibility-report release-out/reproducible-build.json --output release-out/database-certification.json
      - name: Check unified release identity before certification is published
        run: python3 scripts/stable_release.py release-out/CajeerLogs-1.0.0.zip
      - name: OIDC-attest successful final certification report
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-out/database-certification.json
      - name: Verify the authenticated certification report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify release-out/database-certification.json --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: CajeerLogs-1.0.0-certified-ci
          path: |
            release-out/CajeerLogs-1.0.0.zip
            release-out/CajeerLogs-1.0.0.zip.sha256
            release-out/CajeerLogs-1.0.0.sbom.cdx.json
            release-out/CajeerLogs-1.0.0.provenance.json
            release-out/supply-chain-report.json
            release-out/reproducible-build.json
            release-out/database-certification.json
            /tmp/security-acceptance-evidence/security-acceptance.json
          if-no-files-found: error

  publish-ga:
    # Never publish on PRs/branches; only after signed final CI certification.
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.0.0'
    needs: [public-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CajeerLogs-1.0.0-certified-ci
          path: release-out
      - name: Verify authenticated archive and certification; publish immutable GA assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ga_release.py publish \
            --archive release-out/CajeerLogs-1.0.0.zip \
            --checksum release-out/CajeerLogs-1.0.0.zip.sha256 \
            --certificate release-out/database-certification.json \
            --sbom release-out/CajeerLogs-1.0.0.sbom.cdx.json \
            --provenance release-out/CajeerLogs-1.0.0.provenance.json \
            --supply-chain release-out/supply-chain-report.json \
            --reproduction release-out/reproducible-build.json \
            --notes docs/Production-Stable-GA-1.0.0.md \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA"

  clickhouse-integration:
    name: ClickHouse 25.8 real HTTP/DDL/aggregation
    needs: build-candidate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cajeer_logs
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-superuser-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cajeer_logs"
          --health-interval 5s --health-timeout 5s --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_DB: cajeer_logs
          CLICKHOUSE_USER: cajeer_logs
          CLICKHOUSE_PASSWORD: ci-clickhouse-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user cajeer_logs --password ci-clickhouse-password --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      APP_ENV: test
      APP_DEBUG: 'false'
      APP_URL: http://localhost:8080
      CAJEER_TEST_CLICKHOUSE: '1'
      CAJEER_TEST_DATABASE: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: cajeer_logs
      DB_USERNAME: cajeer_logs
      DB_PASSWORD: ci-app-role-password-only
      DB_SCHEMA: public
      DB_SSLMODE: disable
      CLICKHOUSE_DSN: http://127.0.0.1:8123
      CLICKHOUSE_DATABASE: cajeer_logs
      CLICKHOUSE_USERNAME: cajeer_logs
      CLICKHOUSE_PASSWORD: ci-clickhouse-password
      CLICKHOUSE_ALLOW_INSECURE: 'true'
      CLICKHOUSE_TIMEOUT_SECONDS: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CajeerLogs-1.0.0-candidate-uncertified
          path: release-out
      - name: Verify and extract exact release
        run: |
          (cd release-out && sha256sum -c CajeerLogs-1.0.0.zip.sha256)
          python3 scripts/release.py verify release-out/CajeerLogs-1.0.0.zip --extract /tmp/cajeerlogs-release
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, curl, mbstring, sodium, xml, dom
          coverage: none
      - name: Provision disposable PostgreSQL integration role
        env:
          PGPASSWORD: ci-postgres-superuser-only
        run: |
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          psql -h 127.0.0.1 -U postgres -d cajeer_logs -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE cajeer_logs LOGIN PASSWORD 'ci-app-role-password-only';
          ALTER DATABASE cajeer_logs OWNER TO cajeer_logs;
          SQL
      - name: ClickHouse HTTP transport contract
        run: python3 /tmp/cajeerlogs-release/tests/clickhouse_http.py
      - name: Real ClickHouse migrations, isolation, aggregates
        run: php /tmp/cajeerlogs-release/tests/clickhouse_database.php
      - name: Real PostgreSQL to ClickHouse transactional replication, loss and replay
        run: php /tmp/cajeerlogs-release/tests/analytics_replication_database.php
      - name: Shipped CLI ClickHouse connection
        run: |
          php /tmp/cajeerlogs-release/bin/cajeer analytics:clickhouse status
          php /tmp/cajeerlogs-release/bin/cajeer analytics:clickhouse migrate --confirm
      - name: Certify real PostgreSQL/ClickHouse migration, storage recovery and signed S3 HTTP fault injection from verified archive
        env:
          CAJEER_TEST_SERVICE_STOP: '1'
          CAJEER_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          CAJEER_TEST_CLICKHOUSE_CONTAINER: ${{ job.services.clickhouse.id }}
        run: |
          python3 /tmp/cajeerlogs-release/scripts/analytics_storage_certify.py "$GITHUB_WORKSPACE/release-out/CajeerLogs-1.0.0.zip" --output /tmp/analytics-storage-certification.json
      - uses: actions/upload-artifact@v4
        with:
          name: analytics-storage-evidence
          path: /tmp/analytics-storage-certification.json
          if-no-files-found: error
