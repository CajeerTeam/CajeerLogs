name: Runtime and PostgreSQL
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cajeer_logs
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-superuser-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cajeer_logs"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: cajeer_logs
      DB_USERNAME: cajeer_logs
      DB_PASSWORD: ci-app-role-password-only
      DB_SCHEMA: public
      DB_SSLMODE: disable
      CAJEER_TEST_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, filter, curl, pdo, pdo_pgsql, dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Provision restricted PostgreSQL role
        env:
          PGPASSWORD: ci-postgres-superuser-only
        run: |
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          psql -h 127.0.0.1 -U postgres -d cajeer_logs -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE cajeer_logs LOGIN PASSWORD 'ci-app-role-password-only';
          ALTER DATABASE cajeer_logs OWNER TO cajeer_logs;
          SQL
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: |
          find core config app public bin installer tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l bin/cajeer
      - run: composer analyse
      - run: composer test
      - run: composer test:runtime
      - run: php bin/cajeer install:check
      - run: composer test:database-config
      - run: composer test:database
      - run: composer test:identity
      - run: composer test:identity-database
      - run: composer test:ingest
      - run: composer test:ingest-database
      - run: composer test:search
      - run: composer test:search-database
      - run: php bin/cajeer openapi:lint
      - run: python3 tests/http_runtime.py
      - run: python3 tests/python_ingest.py
      - run: php tests/webhooks.php
      - run: php tests/webhook_database.php
      - run: php tests/queue.php
      - run: php tests/queue_database.php
      - uses: actions/setup-java@v4
        if: matrix.php == '8.4'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.php == '8.4'
        with:
          gradle-version: '8.10.2'
      - name: SDK HTTP and collector tests
        if: matrix.php == '8.4'
        run: |
          npm --prefix packages/ts-sdk install --no-audit --no-fund
          python3 tests/sdk_wire.py
      - name: Admin asset verification
        run: npm --prefix admin run build
      - name: Install browser test runner
        if: matrix.php == '8.4'
        run: |
          python3 -m venv /tmp/cajeer-browser-venv
          /tmp/cajeer-browser-venv/bin/pip install 'playwright==1.52.0'
          /tmp/cajeer-browser-venv/bin/python -m playwright install --with-deps chromium
      - name: Admin browser interaction tests
        if: matrix.php == '8.4'
        run: /tmp/cajeer-browser-venv/bin/python tests/admin_browser.py
      - name: Admin browser PostgreSQL E2E
        if: matrix.php == '8.4'
        run: /tmp/cajeer-browser-venv/bin/python tests/admin_browser_database.py
