name: Repair dependency lockfiles (temporary)
on:
  push:
    branches: [ci/repair-dependency-integrity-20261119]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, pdo, pdo_pgsql, ctype, filter, curl, mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: docker/setup-buildx-action@v3
      - name: Generate authentic package-manager lockfiles
        run: |
          composer update --no-interaction --prefer-dist --no-progress --no-scripts
          (cd packages/ts-sdk && npm install --package-lock-only --ignore-scripts --no-fund --no-audit)
          (cd clients/java-kotlin && gradle --no-daemon --write-locks --write-verification-metadata sha256 build)
          python3 scripts/dependency_locks.py verify
      - name: Commit actual resolved lockfiles to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock packages/ts-sdk/package-lock.json clients/java-kotlin/gradle.lockfile clients/java-kotlin/gradle/verification-metadata.xml
          git commit -m "ci: commit registry-resolved and verified dependency locks"
          git push origin HEAD:ci/repair-dependency-integrity-20261119
      - name: Strict independent dependency verification
        run: python3 scripts/dependency_locks.py verify --install
