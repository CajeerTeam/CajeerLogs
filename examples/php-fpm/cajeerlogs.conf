; Example pool. Create the cajeerlogs system account and set actual permissions first.
[cajeerlogs]
user = cajeerlogs
group = cajeerlogs
listen = /run/php/cajeerlogs.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
clear_env = yes
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/cajeerlogs/storage/logs/php-error.log
