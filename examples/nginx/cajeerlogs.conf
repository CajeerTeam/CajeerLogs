# Replace domain/certificate paths before enabling this production example.
server {
    listen 80;
    server_name logs.example.com;
    return 308 https://logs.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name logs.example.com;
    ssl_certificate /etc/letsencrypt/live/logs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logs.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/cajeerlogs/public;
    index index.php;
    client_max_body_size 16m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /admin {
        return 308 /admin/;
    }
    location = /admin/ {
        rewrite ^ /index.php last;
    }
    location /admin/assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PHP_VALUE "display_errors=Off\npost_max_size=16M";
        fastcgi_pass unix:/run/php/cajeerlogs.sock;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
