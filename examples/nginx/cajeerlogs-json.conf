# Place inside the Nginx `http { ... }` context. An access_log directive for
# individual sites must also be configured in their `server { ... }` blocks.
# Nginx's escape=json quotes and escapes variables safely per field.
log_format cajeerlogs_access escape=json
    '{"time_iso8601":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"status":"$status",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"upstream_response_time":"$upstream_response_time"}';

# Example, inside your chosen server { ... }:
# access_log /var/log/nginx/cajeerlogs-access.jsonl cajeerlogs_access;
# Collector: --format nginx-json --file /var/log/nginx/cajeerlogs-access.jsonl
