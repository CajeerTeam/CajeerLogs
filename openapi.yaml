    "/system/updates/verified/{version}": {
      "get": {
        "operationId": "verifiedUpdate",
        "summary": "Check whether a published update ZIP is already cryptographically verified",
        "description": "Authenticated system:read; inspects a previously downloaded private archive and checks its saved SHA-256 without contacting remote hosts or installing code.",
        "security": [
          {
            "session": []
          },
          {
            "bearer": []
          }
        ],
        "parameters": [
          {
            "name": "version",
            "in": "path",
            "required": true,
            "description": "Exact SemVer of a previously verified published release",
            "schema": {
              "type": "string",
              "pattern": "^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Verified record or not_downloaded",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": {
                      "type": "string",
                      "enum": [
                        "verified",
                        "not_downloaded"
                      ]
                    },
                    "version": {
                      "type": "string"
                    },
                    "sha256": {
                      "type": "string"
                    },
                    "provenance": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "system:read permission required"
          },
          "422": {
            "description": "Invalid release version"
          },
          "503": {
            "description": "Private archive storage unavailable"
          }
        }
      }
    },
    "/system/updates/artifact/{version}": {
      "get": {
        "operationId": "downloadVerifiedUpdate",
        "summary": "Download a locally verified signed release archive",
        "description": "Authenticated system:read; streams an already verified ZIP using a checked file descriptor. Does not trigger a download from GitHub, extract files or install updates.",
        "security": [
          {
            "session": []
          },
          {
            "bearer": []
          }
