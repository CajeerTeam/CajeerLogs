{
  "openapi": "3.1.1",
  "info": {
    "title": "CajeerLogs API",
    "version": "0.0.1",
    "description": "Implemented runtime API. Health is runtime-only; no database or ingestion readiness is asserted."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "operationId": "getHealth",
        "summary": "Runtime health",
        "responses": {
          "200": {
            "description": "Runtime healthy",
            "headers": {
              "X-Request-ID": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthResponse"
                }
              }
            }
          },
          "503": {
            "description": "Runtime checks failed",
            "headers": {
              "X-Request-ID": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthResponse"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "HealthResponse": {
        "type": "object",
        "required": [
          "status",
          "service",
          "version",
          "scope"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok",
              "down"
            ]
          },
          "service": {
            "type": "string"
          },
          "version": {
            "type": "string"
          },
          "scope": {
            "type": "string",
            "const": "runtime"
          }
        }
      }
    }
  }
}
