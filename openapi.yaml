                "schema": {
                  "type": "integer"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "description": "Requires an active logs:write credential in the same project and source/service scope. New deliveries can be polled by active members of the original credential rotation family; legacy jobs require the original token. Uses the same IP and token request budgets as sync and async ingest. Revoked credentials cannot poll."
