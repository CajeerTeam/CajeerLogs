              "example": "[\"22222222-2222-4222-8222-222222222222\"]"
            }
          },
          {
            "name": "services",
            "in": "query",
            "required": false,
            "description": "JSON array of exact service strings; any match.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"api\",\"worker\"]"
            }
          },
          {
            "name": "hosts",
            "in": "query",
            "required": false,
            "description": "JSON array of exact host strings; any match.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"host1\",\"host2\"]"
            }
          },
          {
            "name": "trace_ids",
            "in": "query",
            "required": false,
            "description": "JSON array of exact trace IDs; any match.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"trace-1\",\"trace-2\"]"
            }
          },
          {
            "name": "request_ids",
            "in": "query",
            "required": false,
            "description": "JSON array of exact request IDs; any match.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"req-1\",\"req-2\"]"
            }
          },
          {
            "name": "tags_all",
            "in": "query",
            "required": false,
            "description": "JSON array of exact tags; all must be present.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"db\",\"prod\"]"
            }
          },
          {
            "name": "tags_any",
            "in": "query",
            "required": false,
            "description": "JSON array of exact tags; at least one must be present.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"db\",\"queue\"]"
            }
          },
          {
            "name": "context_path",
            "in": "query",
            "required": false,
            "description": "JSON array of 1..8 nonblank string path segments. Requires from/to spanning at most 31 days. Without context_equals, checks path existence, including JSON null.",
            "schema": {
              "type": "string",
              "maxLength": 2048,
              "example": "[\"nested\",\"region\"]"
            }
          },
          {
            "name": "context_equals",
            "in": "query",
            "required": false,
            "description": "Exact JSON scalar at context_path (string, number, boolean or null); type-sensitive. Raw JSON numeric precision is preserved.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "\"eu\""
            }
          },
          {
            "name": "consistency",
            "in": "query",
            "required": false,
            "description": "live (default) or snapshot: fixes a server received_at watermark for normal log inserts; retention and redaction remain visible.",
            "schema": {
              "type": "string",
              "enum": [
                "live",
                "snapshot"
              ],
              "default": "live"
            }
          },
          {
            "name": "If-Match",
            "in": "header",
            "required": false,
            "description": "Quoted page_digest from the displayed page. Returns 412 if the page changed.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "error_fingerprint",
            "in": "query",
            "required": false,
            "description": "SHA-256 error grouping fingerprint; requires a time range of at most 31 days.",
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$"
            }
          },
          {
            "name": "related_event",
            "in": "query",
            "required": false,
            "description": "UUID of an accessible correlation anchor in the same project; requires a range of at most seven days.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "relation",
            "in": "query",
            "required": false,
            "description": "Correlation by trace, request, or either identifier; requires related_event.",
            "schema": {
              "type": "string",
              "enum": [
                "trace",
                "request",
                "either"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful query",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LogPage"
                }
              },
              "text/csv": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "headers": {
              "Content-Disposition": {
                "schema": {
                  "type": "string"
                }
              },
              "X-Next-Cursor": {
                "description": "Present when another page exists.",
                "schema": {
                  "type": "string"
                }
              },
              "X-Prev-Cursor": {
                "description": "Present when a newer page can be requested.",
                "schema": {
                  "type": "string"
                }
              },
              "X-Page-Cursor": {
                "description": "Signed cursor of the exported page.",
                "schema": {
                  "type": "string"
                }
              },
              "X-Page-Digest": {
                "description": "SHA-256 of the JSON items array before CSV transformation.",
                "schema": {
                  "type": "string",
                  "pattern": "^[a-f0-9]{64}$"
                }
              }
            }
          },
          "400": {
            "description": "Bad request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Forbidden or HTTPS required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "Invalid query",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Shared request or event quota exceeded. Retry-After is the request limiter delay in whole seconds; additional budgets may still apply.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Internal error",
