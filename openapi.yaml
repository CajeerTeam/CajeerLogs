    "/logs/errors": {
      "get": {
        "operationId": "errorAnalytics",
        "summary": "Exact project-scoped fingerprint groups, UTC trend and equal-duration comparison over 31 days",
        "description": "Groups error, critical, alert and emergency events by a versioned normalized message+service fingerprint. Reads authoritative PostgreSQL rows; changes, redaction and retention are reflected immediately. Returns exact totals and up to 100 groups with a truncation flag; previous-group counts are null when unknown due to truncation.",
        "security": [
          {
            "session": []
          },
          {
            "bearer": []
          }
        ],
        "parameters": [
          {
            "name": "project_id",
            "in": "query",
            "required": true,
            "description": "Required project UUID; permission checked for every operation.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "source_id",
            "in": "query",
            "required": false,
            "description": "Source UUID; automatically restricted to the token source if bound.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "source",
            "in": "query",
            "required": false,
            "description": "Exact registered source slug.",
            "schema": {
              "type": "string",
              "maxLength": 100
            }
          },
          {
            "name": "level",
            "in": "query",
            "required": false,
            "description": "Exact PSR-3 level.",
            "schema": {
              "type": "string",
              "enum": [
                "debug",
                "info",
                "notice",
                "warning",
                "error",
                "critical",
                "alert",
                "emergency"
              ]
            }
          },
          {
            "name": "service",
            "in": "query",
            "required": false,
            "description": "Exact service.",
            "schema": {
              "type": "string",
              "maxLength": 255
            }
          },
          {
            "name": "host",
            "in": "query",
            "required": false,
            "description": "Exact host.",
            "schema": {
              "type": "string",
              "maxLength": 255
            }
          },
          {
            "name": "trace_id",
            "in": "query",
            "required": false,
            "description": "Exact trace ID.",
            "schema": {
              "type": "string",
              "maxLength": 128
            }
          },
          {
            "name": "request_id",
            "in": "query",
            "required": false,
            "description": "Exact request ID.",
            "schema": {
              "type": "string",
              "maxLength": 128
            }
          },
          {
            "name": "from",
            "in": "query",
            "required": true,
            "description": "Inclusive occurred_at lower bound.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "to",
            "in": "query",
            "required": true,
            "description": "Exclusive occurred_at upper bound.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "q",
            "in": "query",
            "required": false,
            "description": "PostgreSQL websearch_to_tsquery simple configuration.",
            "schema": {
              "type": "string",
              "maxLength": 512
            }
          },
          {
            "name": "tag",
            "in": "query",
            "required": false,
            "description": "Exact tag.",
            "schema": {
              "type": "string",
              "maxLength": 128
            }
          },
          {
            "name": "context",
            "in": "query",
            "required": false,
            "description": "JSON object encoded as query string; JSONB containment.",
            "schema": {
              "type": "string",
              "maxLength": 4096
            }
          },
          {
            "name": "q_mode",
            "in": "query",
            "required": false,
            "description": "Full-text mode. web (default): websearch syntax; plain: all terms; phrase: adjacent terms. Requires q.",
            "schema": {
              "type": "string",
              "enum": [
                "web",
                "plain",
                "phrase"
              ],
              "default": "web"
            }
          },
          {
            "name": "levels",
            "in": "query",
            "required": false,
            "description": "JSON array of PSR-3 levels; any match. 1..16 strings.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"error\",\"warning\"]"
            }
          },
          {
            "name": "sources",
            "in": "query",
            "required": false,
            "description": "JSON array of registered source slugs; any match, within the requested project and effective source scope.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"app\",\"worker\"]"
            }
          },
          {
            "name": "source_ids",
            "in": "query",
            "required": false,
            "description": "JSON array of source UUIDs; any match, intersected with effective source scope.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"22222222-2222-4222-8222-222222222222\"]"
            }
          },
          {
            "name": "services",
            "in": "query",
            "required": false,
            "description": "JSON array of exact service strings; any match.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"api\",\"worker\"]"
            }
          },
          {
            "name": "hosts",
            "in": "query",
            "required": false,
            "description": "JSON array of exact host strings; any match.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"host1\",\"host2\"]"
            }
          },
          {
            "name": "trace_ids",
            "in": "query",
            "required": false,
            "description": "JSON array of exact trace IDs; any match.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"trace-1\",\"trace-2\"]"
            }
          },
          {
            "name": "request_ids",
            "in": "query",
            "required": false,
            "description": "JSON array of exact request IDs; any match.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"req-1\",\"req-2\"]"
            }
          },
          {
            "name": "tags_all",
            "in": "query",
            "required": false,
            "description": "JSON array of exact tags; all must be present.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"db\",\"prod\"]"
            }
          },
          {
            "name": "tags_any",
            "in": "query",
            "required": false,
            "description": "JSON array of exact tags; at least one must be present.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"db\",\"queue\"]"
            }
          },
          {
            "name": "context_path",
            "in": "query",
            "required": false,
            "description": "JSON array of 1..8 nonblank string path segments. Requires from/to spanning at most 31 days. Without context_equals, checks path existence, including JSON null.",
            "schema": {
              "type": "string",
              "maxLength": 2048,
              "example": "[\"nested\",\"region\"]"
            }
          },
          {
            "name": "context_equals",
            "in": "query",
            "required": false,
            "description": "Exact JSON scalar at context_path (string, number, boolean or null); type-sensitive. Raw JSON numeric precision is preserved.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "\"eu\""
            }
          },
          {
            "name": "error_fingerprint",
            "in": "query",
            "required": false,
            "description": "SHA-256 error grouping fingerprint; requires a time range of at most 31 days.",
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$"
            }
          },
          {
            "name": "interval",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "minute",
                "5min",
                "hour",
                "day"
              ]
            },
            "description": "Trend bucket granularity (minute at most 6 hours, 5min at most 2 days)."
          },
          {
            "name": "related_event",
            "in": "query",
            "required": false,
            "description": "UUID of an accessible correlation anchor in the same project; requires a range of at most seven days.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "relation",
            "in": "query",
            "required": false,
            "description": "Correlation by trace, request, or either identifier; requires related_event.",
            "schema": {
              "type": "string",
              "enum": [
                "trace",
                "request",
                "either"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Error report including top fingerprint groups, trend buckets and comparison totals",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": true
                }
              }
            }
          },
          "400": {
            "description": "Bad request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
