                "schema": {
                  "type": "string",
                  "format": "uuid"
                },
                "description": "Next page cursor when NDJSON has more records"
              }
            }
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not found"
          },
          "409": {
            "description": "Conflict"
          },
