{
  "openapi": "3.1.1",
  "info": {
    "title": "CajeerLogs API",
    "version": "0.1.1",
    "description": "Identity & Access, synchronous and durable asynchronous PostgreSQL ingestion, job status, project-scoped search, statistics and export. Outgoing webhooks and lifecycle administration use the CLI. TOTP enrollment, recovery codes and administrator enrollment policy."
  },
