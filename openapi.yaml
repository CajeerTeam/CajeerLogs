          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "email": {
                    "type": "string",
                    "format": "email",
                    "maxLength": 255
                  },
                  "password": {
                    "type": "string",
                    "writeOnly": true,
                    "maxLength": 1024
                  },
                  "otp": {
                    "type": "string",
                    "writeOnly": true,
                    "description": "Six-digit TOTP or one-time 32-hex recovery code (required when 2FA enabled).",
                    "maxLength": 32
                  }
                },
                "required": [
                  "email",
                  "password"
                ],
                "additionalProperties": false
              }
            }
          }
        },
        "description": "If the password is correct and TOTP is enabled, a missing otp returns 401 second_factor_required without issuing a session. Resubmit email, password and TOTP or recovery code. Invalid credentials return 401 unauthorized."
