    "/ingest": {
      "post": {
        "operationId": "ingestEvents",
        "summary": "Store one or more log events atomically",
        "description": "Requires project/source-scoped logs:write bearer. No session authentication. HMAC headers are optional unless INGEST_REQUIRE_HMAC=true; send all three together. See docs/Log-Ingestion.md. Limits are measured in UTF-8 bytes. Ingest body max 1 MiB (or lower global limit), each event max 64 KiB.",
        "security": [
          {
            "bearer": []
          }
        ],
        "parameters": [
          {
            "in": "header",
            "name": "Idempotency-Key",
            "required": false,
            "description": "Optional per-token key; 24-hour deduplication, exact same raw body.",
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
            }
          },
          {
            "in": "header",
            "name": "X-Log-Timestamp",
            "required": false,
            "description": "Unix seconds, within 300 seconds.",
            "schema": {
              "type": "string",
              "pattern": "^[1-9][0-9]{9}$"
            }
          },
          {
            "in": "header",
            "name": "X-Log-Nonce",
            "required": false,
            "description": "Fresh random nonce per signed attempt.",
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32,64}$"
            }
          },
          {
            "in": "header",
            "name": "X-Log-Signature",
            "required": false,
            "description": "HMAC-SHA256 over canonical request using bearer token as key.",
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "oneOf": [
                  {
                    "$ref": "#/components/schemas/IngestEvent"
                  },
                  {
                    "$ref": "#/components/schemas/IngestBatch"
                  }
                ]
              }
            }
          }
        },
        "responses": {
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/InvalidPayload"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          },
          "503": {
            "$ref": "#/components/responses/Unavailable"
          },
          "413": {
            "description": "Request or event exceeds byte limit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "Unsupported content type or encoding",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "201": {
            "description": "All events committed to PostgreSQL",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/IngestResult"
                }
              }
            }
          },
          "200": {
            "description": "Idempotent replay; original IDs returned, no new records",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/IngestResult"
                }
              }
            }
          }
        }
      }
    },
