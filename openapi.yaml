    "/ingest/async": {
      "post": {
        "operationId": "enqueueEvents",
        "summary": "Durably enqueue a validated single event or batch for asynchronous ingestion",
        "description": "Requires logs:write bearer and Idempotency-Key. HTTP 202 acknowledges a durable job, not stored events. Compact normalized jobs are limited to 2 MiB and PostgreSQL JSONB text to 8 MiB. A job that cannot be decoded or has invalid scope is dead-lettered. Poll the Location with an active logs:write credential of the same rotation family for 0.2.7+ jobs (legacy jobs require exact owner). Same body/key returns existing job; different mode or body returns 409. UTF-8 JSON only; compressed bodies are rejected. HTTP 503 with Retry-After indicates temporary capacity or storage failure; retry with the same Idempotency-Key and a fresh HMAC nonce. Bearer credentials require logs:write in the registered project/source. Sync, async and job polling share the ingest IP and token request budgets. Authorization is rechecked under the token lock before confirmation. New deliveries share a rotation-family key namespace and a configurable 1-30 day retention (default 7 days), starting at sync commit or async completion/cancellation; pending/running/dead jobs retain their key. Legacy records retain their original guarantees.",
        "security": [
          {
            "bearer": []
          }
        ],
        "parameters": [
          {
            "in": "header",
            "name": "Idempotency-Key",
            "required": true,
            "description": "Required per-token key; retained while active or dead and at least seven days after completion/cancellation until cleanup.",
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
            }
          },
          {
            "in": "header",
            "name": "X-Log-Timestamp",
            "required": false,
            "description": "Unix seconds, within 300 seconds.",
            "schema": {
              "type": "string",
              "pattern": "^[1-9][0-9]{9}$"
            }
          },
          {
            "in": "header",
            "name": "X-Log-Nonce",
            "required": false,
            "description": "Fresh random nonce per signed attempt.",
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32,64}$"
            }
          },
          {
            "in": "header",
            "name": "X-Log-Signature",
            "required": false,
            "description": "HMAC-SHA256 over canonical request using bearer token as key.",
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$"
            }
          },
          {
            "name": "X-Log-Key-Id",
            "in": "header",
            "required": false,
            "description": "Separate signing key UUID; selects HMAC v2. Required for credentials configured for separate signing.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "oneOf": [
                  {
                    "$ref": "#/components/schemas/IngestEvent"
                  },
                  {
                    "$ref": "#/components/schemas/IngestBatch"
                  }
                ]
              }
            }
          }
        },
        "responses": {
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "409": {
            "$ref": "#/components/responses/Conflict",
            "description": "Idempotency conflict or archived project"
          },
          "422": {
            "$ref": "#/components/responses/InvalidPayload"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited",
            "description": "Rate limit or project event quota exceeded"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          },
          "503": {
            "description": "Temporary storage failure, ingest concurrency limit or queue capacity; retry safely with the same key. A concurrent credential policy change also requires a retry.",
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "integer"
                },
                "description": "Suggested retry delay in seconds."
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Request or event exceeds byte limit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "Unsupported content type or encoding",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "200": {
            "description": "Existing job returned, no duplicate job",
            "headers": {
              "Location": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "accepted",
                    "received",
                    "job_id",
                    "status",
                    "replayed"
                  ],
                  "properties": {
                    "accepted": {
                      "type": "boolean"
                    },
                    "received": {
                      "type": "integer"
                    },
                    "job_id": {
                      "type": "string",
                      "pattern": "^[1-9][0-9]{0,18}$"
                    },
                    "status": {
                      "type": "string",
                      "enum": [
                        "pending",
                        "running",
                        "completed",
                        "dead",
                        "cancelled"
                      ]
                    },
                    "replayed": {
                      "type": "boolean"
                    }
                  }
                }
              }
            }
          },
          "202": {
            "description": "Durable job committed; processing pending",
            "headers": {
              "Location": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "accepted",
                    "received",
                    "job_id",
                    "status",
                    "replayed"
                  ],
                  "properties": {
                    "accepted": {
                      "type": "boolean"
                    },
                    "received": {
                      "type": "integer"
                    },
                    "job_id": {
                      "type": "string",
                      "pattern": "^[1-9][0-9]{0,18}$"
                    },
                    "status": {
                      "type": "string",
                      "enum": [
                        "pending",
                        "running",
                        "completed",
                        "dead",
                        "cancelled"
                      ]
                    },
                    "replayed": {
                      "type": "boolean"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
