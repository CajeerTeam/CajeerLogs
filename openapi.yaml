  "components": {
    "schemas": {
      "HealthResponse": {
        "type": "object",
        "required": [
          "status",
          "service",
          "version",
          "scope"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok",
              "down"
            ]
          },
          "service": {
            "type": "string"
          },
          "version": {
            "type": "string"
          },
          "scope": {
            "type": "string",
            "const": "runtime"
          }
        }
      },
      "User": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "email": {
            "type": "string",
            "format": "email",
            "maxLength": 255
          },
          "role": {
            "type": "string",
            "enum": [
              "administrator",
              "operator",
              "viewer"
            ]
          },
          "blocked_at": {
            "type": [
              "string",
              "null"
            ]
          },
          "two_factor_enabled": {
            "type": "boolean"
          },
          "created_at": {
            "type": "string"
          },
          "updated_at": {
            "type": "string"
          },
          "display_name": {
            "type": "string",
            "maxLength": 120
          },
          "last_login_at": {
            "type": [
              "string",
              "null"
            ]
          },
          "permissions": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "uniqueItems": true
          },
          "rbac_role_id": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          }
        },
        "required": [
          "id",
          "email",
          "role"
        ],
        "additionalProperties": false
      },
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "request_id": {
            "type": "string"
          },
          "details": {
            "type": "object",
            "description": "Optional safe validation diagnostics, never input values or arbitrary field names.",
            "properties": {
              "event_index": {
                "type": "integer",
                "minimum": 0,
                "maximum": 99
              },
              "field": {
                "type": "string",
                "enum": [
                  "timestamp",
                  "source",
                  "level",
                  "message",
                  "context",
                  "service",
                  "host",
                  "trace_id",
                  "request_id",
                  "tags"
                ]
              },
              "reason": {
                "type": "string"
              }
            },
            "required": [
              "reason"
            ],
            "additionalProperties": false
          }
        },
        "required": [
          "error",
          "message",
          "request_id"
        ],
        "additionalProperties": false
      },
      "Page": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": true
            }
          },
          "next_cursor": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          }
        },
        "required": [
          "items",
          "next_cursor"
        ],
        "additionalProperties": false
      },
      "IngestEvent": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "timestamp",
          "source",
          "level",
          "message"
        ],
        "properties": {
          "timestamp": {
            "type": "string",
            "format": "date-time",
            "description": "RFC3339 with timezone, up to six fractional digits. Normalized to UTC. Optional configured age/future admission windows apply to new operations only."
          },
          "source": {
            "type": "string",
            "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
            "maxLength": 100,
            "description": "Registered source slug in the token project."
          },
          "level": {
            "type": "string",
            "enum": [
              "debug",
              "info",
              "notice",
              "warning",
              "error",
              "critical",
              "alert",
              "emergency"
            ],
            "description": "Case-insensitive PSR-3 level."
          },
          "message": {
            "type": "string",
            "minLength": 1,
            "maxLength": 16384
          },
          "context": {
            "type": "object",
            "additionalProperties": true,
            "description": "Maximum 32768 UTF-8 JSON bytes; known secrets are masked. Duplicate object keys rejected, max 24 event levels, 2048 items/container, 8192 nodes/event, keys up to 256 UTF-8 bytes. Integers outside signed 64-bit range and high-precision or underflowing decimal numbers are preserved as strings; nonfinite numbers rejected."
          },
          "service": {
            "type": [
              "string",
              "null"
            ],
            "minLength": 1,
            "maxLength": 255
          },
          "host": {
            "type": [
              "string",
              "null"
            ],
            "minLength": 1,
            "maxLength": 255
          },
          "trace_id": {
            "type": [
              "string",
              "null"
            ],
            "minLength": 1,
            "maxLength": 128
          },
          "request_id": {
            "type": [
              "string",
              "null"
            ],
            "minLength": 1,
            "maxLength": 128
          },
          "tags": {
            "type": "array",
            "maxItems": 32,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            }
          }
        }
      },
      "IngestBatch": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "events"
        ],
        "properties": {
          "events": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/IngestEvent"
            }
          }
        }
      },
      "IngestResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "accepted",
          "received",
          "stored",
          "rejected",
          "event_ids",
