    "/ingest": {
      "post": {
        "operationId": "ingestEvents",
        "summary": "Store one or more log events atomically",
        "description": "Requires project/source-scoped logs:write bearer. No session authentication. HMAC headers are optional unless INGEST_REQUIRE_HMAC=true; send all three together. See docs/Log-Ingestion.md. Limits are measured in UTF-8 bytes. Ingest body max 1 MiB (or lower global limit), each event max 64 KiB. UTF-8 JSON only; compressed bodies are rejected. HTTP 503 with Retry-After indicates temporary capacity or storage failure; retry with the same Idempotency-Key and a fresh HMAC nonce. Bearer credentials require logs:write in the registered project/source. Sync, async and job polling share the ingest IP and token request budgets. Authorization is rechecked under the token lock before confirmation. New deliveries share a rotation-family key namespace and a configurable 1-30 day retention (default 7 days), starting at sync commit or async completion/cancellation; pending/running/dead jobs retain their key. Legacy records retain their original guarantees.",
        "security": [
          {
            "bearer": []
          }
        ],
        "parameters": [
          {
            "in": "header",
            "name": "Idempotency-Key",
            "required": false,
            "description": "Optional per-token key; 24-hour deduplication, exact same raw body.",
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
            }
          },
          {
            "in": "header",
            "name": "X-Log-Timestamp",
            "required": false,
            "description": "Unix seconds, within 300 seconds.",
            "schema": {
              "type": "string",
              "pattern": "^[1-9][0-9]{9}$"
            }
          },
          {
            "in": "header",
            "name": "X-Log-Nonce",
            "required": false,
            "description": "Fresh random nonce per signed attempt.",
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32,64}$"
            }
          },
          {
            "in": "header",
            "name": "X-Log-Signature",
            "required": false,
            "description": "HMAC-SHA256 over canonical request using bearer token as key.",
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$"
            }
          },
          {
            "name": "X-Log-Key-Id",
            "in": "header",
            "required": false,
            "description": "Separate signing key UUID; selects HMAC v2. Required for credentials configured for separate signing.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "oneOf": [
                  {
                    "$ref": "#/components/schemas/IngestEvent"
                  },
                  {
                    "$ref": "#/components/schemas/IngestBatch"
                  }
                ]
              }
            }
          }
        },
        "responses": {
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "409": {
            "$ref": "#/components/responses/Conflict",
            "description": "Idempotency conflict or archived project"
          },
          "422": {
            "$ref": "#/components/responses/InvalidPayload"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited",
            "description": "Rate limit or project event quota exceeded"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          },
          "503": {
            "description": "Temporary storage failure, ingest concurrency limit or queue capacity; retry safely with the same key. A concurrent credential policy change also requires a retry.",
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "integer"
                },
                "description": "Suggested retry delay in seconds."
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Request or event exceeds byte limit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "Unsupported content type or encoding",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "201": {
            "description": "All events committed to PostgreSQL",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/IngestResult"
                }
              }
            }
          },
          "200": {
            "description": "Idempotent replay; original IDs returned, no new records",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/IngestResult"
                }
              }
            }
          }
        }
      }
    },
    "/logs": {
      "get": {
        "operationId": "searchLogs",
        "summary": "Search logs",
        "description": "Requires logs:read; session membership or token project/source scope is enforced. Results are scoped to the requested project. All filter groups are ANDed; list values match any except tags_all. JSON lists are scalar URL-encoded strings (1–16 entries each, 64 total). Search without an indexable FTS term requires a time range of at most 31 days. PostgreSQL search timeout returns 503 search_timeout. Signed v2 bidirectional keyset cursors expire after one hour and are bound to the authenticated principal, effective filters and consistency mode. Restart searches using older cursors. Pages are bounded by bytes as well as count; snapshot uses a received_at watermark, not a long-lived MVCC snapshot.",
        "security": [
          {
            "session": []
          },
          {
            "bearer": []
          }
        ],
        "parameters": [
          {
            "name": "project_id",
            "in": "query",
            "required": true,
            "description": "Required project UUID; permission checked for every operation.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "source_id",
            "in": "query",
            "required": false,
            "description": "Source UUID; automatically restricted to the token source if bound.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "source",
            "in": "query",
            "required": false,
            "description": "Exact registered source slug.",
            "schema": {
              "type": "string",
              "maxLength": 100
            }
          },
          {
            "name": "level",
            "in": "query",
            "required": false,
            "description": "Exact PSR-3 level.",
            "schema": {
              "type": "string",
              "enum": [
                "debug",
                "info",
                "notice",
                "warning",
                "error",
                "critical",
                "alert",
                "emergency"
              ]
            }
          },
          {
            "name": "service",
            "in": "query",
            "required": false,
            "description": "Exact service.",
            "schema": {
              "type": "string",
              "maxLength": 255
            }
          },
          {
            "name": "host",
            "in": "query",
            "required": false,
            "description": "Exact host.",
            "schema": {
              "type": "string",
              "maxLength": 255
            }
          },
          {
            "name": "trace_id",
            "in": "query",
            "required": false,
            "description": "Exact trace ID.",
            "schema": {
              "type": "string",
              "maxLength": 128
            }
          },
          {
            "name": "request_id",
            "in": "query",
            "required": false,
            "description": "Exact request ID.",
            "schema": {
              "type": "string",
              "maxLength": 128
            }
          },
          {
            "name": "from",
            "in": "query",
            "required": false,
            "description": "Inclusive occurred_at lower bound.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "to",
            "in": "query",
            "required": false,
            "description": "Exclusive occurred_at upper bound.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "q",
            "in": "query",
            "required": false,
            "description": "PostgreSQL websearch_to_tsquery simple configuration.",
            "schema": {
              "type": "string",
              "maxLength": 512
            }
          },
          {
            "name": "tag",
            "in": "query",
            "required": false,
            "description": "Exact tag.",
            "schema": {
              "type": "string",
              "maxLength": 128
            }
          },
          {
            "name": "context",
            "in": "query",
            "required": false,
            "description": "JSON object encoded as query string; JSONB containment.",
            "schema": {
              "type": "string",
              "maxLength": 4096
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "description": "Page size.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "description": "Opaque signed next_cursor, prev_cursor or page_cursor from an authorized response. Keep filters and consistency unchanged; cursor expires after one hour. Legacy v1 cursors are rejected.",
            "schema": {
              "type": "string",
              "maxLength": 1024
            }
          },
          {
            "name": "q_mode",
            "in": "query",
            "required": false,
            "description": "Full-text mode. web (default): websearch syntax; plain: all terms; phrase: adjacent terms. Requires q.",
            "schema": {
              "type": "string",
              "enum": [
                "web",
                "plain",
                "phrase"
              ],
              "default": "web"
            }
          },
          {
            "name": "levels",
            "in": "query",
            "required": false,
            "description": "JSON array of PSR-3 levels; any match. 1..16 strings.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"error\",\"warning\"]"
            }
          },
          {
            "name": "sources",
            "in": "query",
            "required": false,
            "description": "JSON array of registered source slugs; any match, within the requested project and effective source scope.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"app\",\"worker\"]"
            }
          },
          {
            "name": "source_ids",
            "in": "query",
            "required": false,
            "description": "JSON array of source UUIDs; any match, intersected with effective source scope.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"22222222-2222-4222-8222-222222222222\"]"
            }
          },
          {
            "name": "services",
            "in": "query",
            "required": false,
            "description": "JSON array of exact service strings; any match.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"api\",\"worker\"]"
            }
          },
          {
            "name": "hosts",
            "in": "query",
            "required": false,
            "description": "JSON array of exact host strings; any match.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"host1\",\"host2\"]"
            }
          },
          {
            "name": "trace_ids",
            "in": "query",
            "required": false,
            "description": "JSON array of exact trace IDs; any match.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"trace-1\",\"trace-2\"]"
            }
          },
          {
            "name": "request_ids",
            "in": "query",
            "required": false,
            "description": "JSON array of exact request IDs; any match.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"req-1\",\"req-2\"]"
            }
          },
          {
            "name": "tags_all",
            "in": "query",
            "required": false,
            "description": "JSON array of exact tags; all must be present.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"db\",\"prod\"]"
            }
          },
          {
            "name": "tags_any",
            "in": "query",
            "required": false,
            "description": "JSON array of exact tags; at least one must be present.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "[\"db\",\"queue\"]"
            }
          },
          {
            "name": "context_path",
            "in": "query",
            "required": false,
            "description": "JSON array of 1..8 nonblank string path segments. Requires from/to spanning at most 31 days. Without context_equals, checks path existence, including JSON null.",
            "schema": {
              "type": "string",
              "maxLength": 2048,
              "example": "[\"nested\",\"region\"]"
            }
          },
          {
            "name": "context_equals",
            "in": "query",
            "required": false,
            "description": "Exact JSON scalar at context_path (string, number, boolean or null); type-sensitive. Raw JSON numeric precision is preserved.",
            "schema": {
              "type": "string",
              "maxLength": 4096,
              "example": "\"eu\""
            }
          },
          {
            "name": "consistency",
            "in": "query",
            "required": false,
            "description": "live (default) or snapshot: fixes a server received_at watermark for normal log inserts; retention and redaction remain visible.",
            "schema": {
              "type": "string",
              "enum": [
                "live",
                "snapshot"
              ],
              "default": "live"
            }
          },
          {
            "name": "error_fingerprint",
            "in": "query",
            "required": false,
            "description": "SHA-256 error grouping fingerprint; requires a time range of at most 31 days.",
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$"
            }
          },
          {
            "name": "related_event",
            "in": "query",
            "required": false,
            "description": "UUID of an accessible correlation anchor in the same project; requires a range of at most seven days.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "relation",
            "in": "query",
            "required": false,
            "description": "Correlation by trace, request, or either identifier; requires related_event.",
            "schema": {
              "type": "string",
              "enum": [
                "trace",
                "request",
                "either"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful query",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LogPage"
                }
              }
            }
          },
          "400": {
            "description": "Bad request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Forbidden or HTTPS required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "Invalid query",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Shared request or event quota exceeded. Retry-After is the request limiter delay in whole seconds; additional budgets may still apply.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Internal error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Storage unavailable or search processing budget exceeded (search_timeout; Retry-After: 5).",
            "content": {
