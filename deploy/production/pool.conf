[www]
; Environment comes from the trusted Compose service, never HTTP headers.
clear_env = no
catch_workers_output = yes
; Default php:fpm image permits only five concurrent requests. Under the
; certified 4/8/16 RPS load ramp, reads and async receipt writes can block one
; another. Permit up to 16 workers (bounded by INGEST_MAX_INFLIGHT=16) while
; keeping the pool elastic at idle.
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 8
pm.max_requests = 500
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[post_max_size] = 16M
php_admin_value[memory_limit] = 256M
security.limit_extensions = .php
