server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /tls/fullchain.pem;
    ssl_certificate_key /tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /app/public;
    client_max_body_size 16m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    error_page 413 = @body_too_large;
    error_page 502 504 = @upstream_unavailable;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Access logs omit query strings, which can contain sensitive search terms.
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location ~ /\. { return 404; }
    location ~ \.php(?:/|$) { return 404; }
    location ~ ^/(?:admin/assets|assets)/[A-Za-z0-9_./-]+\.(?:css|js|png|jpg|jpeg|svg|ico|webp|woff2?)$ { try_files $uri =404; }
    location /admin/assets/ { return 404; }
    location /assets/ { return 404; }
    location @body_too_large {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        return 413 '{"error":"payload_too_large","message":"Request body exceeds the configured limit.","request_id":"$request_id"}';
    }
    location @upstream_unavailable {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        return 503 '{"error":"service_unavailable","message":"Service temporarily unavailable.","request_id":"$request_id"}';
    }
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        # Nginx owns transfer framing and passes the decoded body to FastCGI.
        fastcgi_param HTTP_TRANSFER_ENCODING "" if_not_empty;
        fastcgi_hide_header Strict-Transport-Security;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_request_buffering on;
        fastcgi_read_timeout 65s;
        set $cajeer_backend app:9000;
        fastcgi_pass $cajeer_backend;
    }
}
