server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /tls/fullchain.pem;
    ssl_certificate_key /tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /app/public;
    client_max_body_size 16m;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Access logs omit query strings, which can contain sensitive search terms.
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location ~ /\. { return 404; }
    location ~ \.php(?:/|$) { return 404; }
    location ~ ^/(?:admin/assets|assets)/[A-Za-z0-9_./-]+\.(?:css|js|png|jpg|jpeg|svg|ico|webp|woff2?)$ { try_files $uri =404; }
    location /admin/assets/ { return 404; }
    location /assets/ { return 404; }
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header Strict-Transport-Security;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_read_timeout 65s;
        set $cajeer_backend app:9000;
        fastcgi_pass $cajeer_backend;
    }
}
