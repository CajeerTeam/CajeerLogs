# Run with --env-file .env.production. See docs/First-Public-Release.md.
name: cajeerlogs
x-runtime: &runtime
  image: cajeerlogs:1.0.7
  build:
    context: .
    dockerfile: deploy/production/Dockerfile
    target: app
    args:
      CAJEER_RELEASE_VERSION: '1.0.7'
  environment: &runtime-env
    CAJEER_ENV_FILE: /config/.env
    APP_ENV: production
    CAJEER_RELEASE_VERSION: '1.0.7'
    APP_DEBUG: 'false'
    APP_URL: ${APP_URL:?Set HTTPS APP_URL}
    DB_CONNECTION: pgsql
    DB_HOST: /var/run/postgresql
    DB_PORT: '5432'
    DB_DATABASE: cajeer_logs
    DB_USERNAME: cajeer_logs
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    DB_SCHEMA: public
    DB_SSLMODE: disable
    DB_REQUIRE_TLS: 'false'
    CLICKHOUSE_DSN: ${CLICKHOUSE_DSN:-http://clickhouse:8123}
    CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-cajeer_logs}
    CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-cajeer_logs}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    CLICKHOUSE_ALLOW_INSECURE: ${CLICKHOUSE_ALLOW_INSECURE:-false}
    CLICKHOUSE_TIMEOUT_SECONDS: ${CLICKHOUSE_TIMEOUT_SECONDS:-5}
    SECURITY_TRUSTED_PROXIES: ${SECURITY_TRUSTED_PROXIES:-}
    API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-600}
    API_RATE_SEARCH_PER_MINUTE: ${API_RATE_SEARCH_PER_MINUTE:-120}
    API_RATE_ANALYTICS_PER_MINUTE: ${API_RATE_ANALYTICS_PER_MINUTE:-30}
    API_RATE_EXPORT_PER_MINUTE: ${API_RATE_EXPORT_PER_MINUTE:-10}
    API_RATE_ADMIN_WRITE_PER_MINUTE: ${API_RATE_ADMIN_WRITE_PER_MINUTE:-60}
    API_RATE_BURST_PERCENT: ${API_RATE_BURST_PERCENT:-100}
    RETENTION_SCHEDULER_ENABLED: ${RETENTION_SCHEDULER_ENABLED:-true}
    RETENTION_WINDOW_UTC: ${RETENTION_WINDOW_UTC:-}
    STORAGE_WARN_BYTES: ${STORAGE_WARN_BYTES:-1073741824}
    RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-1000}
    RETENTION_TIMEOUT_MS: ${RETENTION_TIMEOUT_MS:-5000}
    RETENTION_CYCLE_BATCHES: ${RETENTION_CYCLE_BATCHES:-10}
    RETENTION_CYCLE_BUDGET_MS: ${RETENTION_CYCLE_BUDGET_MS:-30000}
    RETENTION_PAUSE_MS: ${RETENTION_PAUSE_MS:-100}
    WEBHOOK_RETENTION_DAYS: ${WEBHOOK_RETENTION_DAYS:-30}
    QUEUE_MAX_JOBS: ${QUEUE_MAX_JOBS:-1000}
    QUEUE_MAX_EVENTS: ${QUEUE_MAX_EVENTS:-100000}
    QUEUE_MAX_BYTES: ${QUEUE_MAX_BYTES:-536870912}
    QUEUE_HIGH_WATERMARK_PERCENT: ${QUEUE_HIGH_WATERMARK_PERCENT:-85}
    QUEUE_LOW_WATERMARK_PERCENT: ${QUEUE_LOW_WATERMARK_PERCENT:-60}
    QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-8}
    QUEUE_RETRY_BASE_SECONDS: ${QUEUE_RETRY_BASE_SECONDS:-5}
    QUEUE_RETRY_MAX_SECONDS: ${QUEUE_RETRY_MAX_SECONDS:-3600}
    QUEUE_RETRY_JITTER_PERCENT: ${QUEUE_RETRY_JITTER_PERCENT:-25}
    QUEUE_OUTAGE_BASE_MS: ${QUEUE_OUTAGE_BASE_MS:-250}
    QUEUE_OUTAGE_MAX_MS: ${QUEUE_OUTAGE_MAX_MS:-30000}
    QUEUE_OUTAGE_MAX_FAILURES: ${QUEUE_OUTAGE_MAX_FAILURES:-10}
    QUEUE_WORKER_PROCESSES: ${QUEUE_WORKER_PROCESSES:-2}
    QUEUE_WORKER_BATCH_JOBS: ${QUEUE_WORKER_BATCH_JOBS:-4}
    QUEUE_WORKER_MAX_JOBS: ${QUEUE_WORKER_MAX_JOBS:-1000}
    QUEUE_WORKER_MAX_SECONDS: ${QUEUE_WORKER_MAX_SECONDS:-3600}
    QUEUE_WORKER_MEMORY_MB: ${QUEUE_WORKER_MEMORY_MB:-256}
    QUEUE_POLL_MIN_MS: ${QUEUE_POLL_MIN_MS:-50}
    QUEUE_POLL_MAX_MS: ${QUEUE_POLL_MAX_MS:-1000}
    QUEUE_LEASE_SECONDS: ${QUEUE_LEASE_SECONDS:-120}
    QUEUE_CLAIM_TIMEOUT_MS: ${QUEUE_CLAIM_TIMEOUT_MS:-5000}
    QUEUE_PROCESS_TIMEOUT_SECONDS: ${QUEUE_PROCESS_TIMEOUT_SECONDS:-90}
    QUEUE_SHUTDOWN_GRACE_SECONDS: ${QUEUE_SHUTDOWN_GRACE_SECONDS:-120}
    QUEUE_RETENTION_FLOOR_SECONDS: ${QUEUE_RETENTION_FLOOR_SECONDS:-0}
    SEARCH_TIMEOUT_MS: ${SEARCH_TIMEOUT_MS:-5000}
    INGEST_MAX_INFLIGHT: ${INGEST_MAX_INFLIGHT:-16}
    INGEST_BUDGET_MS: ${INGEST_BUDGET_MS:-25000}
    INGEST_IDEMPOTENCY_SECONDS: ${INGEST_IDEMPOTENCY_SECONDS:-604800}
    INGEST_MAX_EVENT_AGE_SECONDS: ${INGEST_MAX_EVENT_AGE_SECONDS:-0}
    INGEST_MAX_EVENT_FUTURE_SECONDS: ${INGEST_MAX_EVENT_FUTURE_SECONDS:-0}
    SECURITY_2FA_REQUIRED_FOR_ADMINS: 'true'
    SECURITY_2FA_REQUIRED_ROLES: ${SECURITY_2FA_REQUIRED_ROLES:-}
    SECURITY_2FA_REQUIRED_PERMISSIONS: ${SECURITY_2FA_REQUIRED_PERMISSIONS:-}
    SECURITY_SESSION_IDLE_SECONDS: ${SECURITY_SESSION_IDLE_SECONDS:-1800}
    SECURITY_REAUTH_SECONDS: ${SECURITY_REAUTH_SECONDS:-300}
    SECURITY_TOTP_ACTIVE_KEY: ${SECURITY_TOTP_ACTIVE_KEY:-}
    SECURITY_TOTP_PREVIOUS_KEY: ${SECURITY_TOTP_PREVIOUS_KEY:-}
    AI_ASSISTANT_ENABLED: ${AI_ASSISTANT_ENABLED:-false}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-sol}
    AI_ASSISTANT_INCLUDE_MESSAGES: ${AI_ASSISTANT_INCLUDE_MESSAGES:-false}
    SKIF4ER_ID_ENABLED: ${SKIF4ER_ID_ENABLED:-false}
    SKIF4ER_ID_CLIENT_ID: ${SKIF4ER_ID_CLIENT_ID:-}
    SKIF4ER_ID_CLIENT_SECRET: ${SKIF4ER_ID_CLIENT_SECRET:-}
    SECURITY_SESSION_TTL_SECONDS: ${SECURITY_SESSION_TTL_SECONDS:-28800}
    MONITOR_BACKUP_ENABLED: ${MONITOR_BACKUP_ENABLED:-false}
    PROMETHEUS_TOKEN: ${PROMETHEUS_TOKEN:?Set PROMETHEUS_TOKEN}
  volumes:
    - config:/config:ro
    - storage:/app/storage
    - pgsocket:/var/run/postgresql:ro
  read_only: true
  tmpfs:
    - /tmp:mode=1777
  security_opt:
    - no-new-privileges:true
  networks: [backend]
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    profiles: [analytics]
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-cajeer_logs}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-cajeer_logs}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes: [chdata:/var/lib/clickhouse]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  db:
    image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    environment:
      POSTGRES_DB: cajeer_logs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      CAJEER_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      # Require a password even for local Unix socket connections.
      POSTGRES_INITDB_ARGS: '--auth-local=scram-sha-256 --auth-host=scram-sha-256'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
      - ./deploy/dev/init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d cajeer_logs']
      interval: 5s
      timeout: 3s
      retries: 30
  install:
    <<: *runtime
    profiles: [tools]
    restart: 'no'
    command: [php, bin/cajeer, install, --non-interactive]
    volumes:
      - config:/config
      - storage:/app/storage
      - pgsocket:/var/run/postgresql:ro
  app:
    <<: *runtime
    healthcheck:
      test: [CMD, php, bin/cajeer, health:ready]
      interval: 15s
      timeout: 12s
      retries: 10
      start_period: 10s
  queue:
    <<: *runtime
    command: [php, bin/cajeer, 'queue:pool']
    healthcheck:
      test: [CMD, php, bin/cajeer, queue:pool-health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: ${CAJEER_QUEUE_STOP_GRACE:-130s}
    depends_on:
      app:
        condition: service_healthy
  scheduler:
    <<: *runtime
    command: [cajeer-maintenance, scheduler]
    healthcheck:
      test: [CMD, php, bin/cajeer, health:worker, scheduler]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 90s
    depends_on:
      app:
        condition: service_healthy
  backup:
    <<: *runtime
    profiles: [backup]
    command: [cajeer-maintenance, backup]
    healthcheck:
      test: [CMD, php, bin/cajeer, health:worker, backup]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 14400s
    environment:
      <<: *runtime-env
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_TIMEOUT_SECONDS: ${BACKUP_TIMEOUT_SECONDS:-3600}
      BACKUP_MIN_FREE_BYTES: ${BACKUP_MIN_FREE_BYTES:-104857600}
    stop_grace_period: 90s
    depends_on:
      app:
        condition: service_healthy
  webhook:
    <<: *runtime
    command: [cajeer-maintenance, webhook]
    healthcheck:
      test: [CMD, php, bin/cajeer, health:worker, webhook]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 360s
    # Separate egress network for outbound webhook HTTPS. No host port.
    networks: [backend, egress]
    depends_on:
      app:
        condition: service_healthy
  gateway:
    image: cajeerlogs-gateway:1.0.7
    build:
      context: .
      dockerfile: deploy/production/Dockerfile
      target: gateway
    environment:
      APP_URL: ${APP_URL:?Set HTTPS APP_URL}
    ports:
      - '${CAJEER_HTTPS_BIND:-0.0.0.0}:${CAJEER_HTTPS_PORT:-443}:443'
    volumes:
      - ${CAJEER_TLS_DIR:?Set CAJEER_TLS_DIR}:/tls:ro
    networks: [backend, ingress]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
networks:
  backend:
    internal: true
  ingress: {}
  egress: {}
volumes:
  chdata: {}
  pgdata: {}
  pgsocket: {}
  config: {}
  storage: {}
