# Local development only. Production uses PHP-FPM and Nginx/Apache.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: cajeer_logs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      CAJEER_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/dev/init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d cajeer_logs']
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      dockerfile: deploy/dev/Dockerfile
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    environment:
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: cajeer_logs
      DB_USERNAME: cajeer_logs
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_SCHEMA: public
      DB_SSLMODE: disable
    volumes:
      - .:/app
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
